<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<meta name="robots" content="noindex">
<script>
  // Sites on this domain, plus old names. Paths are case-sensitive on GitHub Pages,
  // so a mistyped or renamed first segment is sent to the right site.
  var SITES = ["Trainings-Dashboard", "IXP-HandsOnWorkshop", "AgenticAdvancedWorkshop",
               "AgenticProfessionalWorkshop", "SoftwareTestingCourse"];
  var OLD = { "ixp-advancedworkshop": "IXP-HandsOnWorkshop" };
  var parts = location.pathname.split("/").filter(Boolean);
  if (parts.length) {
    var key = parts[0].toLowerCase(), hit = OLD[key];
    for (var i = 0; !hit && i < SITES.length; i++) if (SITES[i].toLowerCase() === key) hit = SITES[i];
    if (hit && hit !== parts[0]) {
      parts[0] = hit;
      location.replace("/" + parts.join("/") + (location.pathname.endsWith("/") ? "/" : "") + location.search + location.hash);
    }
  }
</script>
<style>
  :root { color-scheme: light dark; --bg:#f6f6f4; --fg:#1f2328; --muted:#59636e; --link:#0a6c74; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111417; --fg:#e8eaed; --muted:#9aa4ae; --link:#5cc8d0; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:0 16px; text-align:center; }
  h1 { font-size:28px; margin:0 0 8px; } p { margin:0 0 8px; color:var(--muted); } a { color:var(--link); }
</style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The link may be mistyped or out of date.</p>
    <p>All courses and workshops are listed on the <a href="/Trainings-Dashboard/trainings-dashboard.html">UiPath Trainings &amp; Workshops dashboard</a>.</p>
  </main>
</body>
</html>
